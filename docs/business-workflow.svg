<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<rect width="1600" height="760" fill="#ffffff"/>
<text x="60" y="65" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111827">Business Workflow</text>
<text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Rental request → payment verification → fulfillment → return → reporting</text>

<rect x="55" y="170" width="270" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="80" y="210" font-family="Arial" font-size="22" font-weight="700" fill="#1d4ed8">01 • Customer</text>
<text x="80" y="250" font-family="Arial" font-size="17" fill="#374151">Register / Login</text>
<text x="80" y="282" font-family="Arial" font-size="17" fill="#374151">Browse Catalog</text>
<text x="80" y="314" font-family="Arial" font-size="17" fill="#374151">Create Rental Order</text>
<text x="80" y="346" font-family="Arial" font-size="17" fill="#374151">Upload Payment Proof</text>
<text x="80" y="378" font-family="Arial" font-size="17" fill="#374151">Track Order</text>

<rect x="370" y="170" width="270" height="250" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="395" y="210" font-family="Arial" font-size="22" font-weight="700" fill="#047857">02 • Management</text>
<text x="395" y="250" font-family="Arial" font-size="17" fill="#374151">Review Orders</text>
<text x="395" y="282" font-family="Arial" font-size="17" fill="#374151">Verify Payment</text>
<text x="395" y="314" font-family="Arial" font-size="17" fill="#374151">Update Rental Status</text>
<text x="395" y="346" font-family="Arial" font-size="17" fill="#374151">Prepare Fulfillment</text>
<text x="395" y="378" font-family="Arial" font-size="17" fill="#374151">Generate Reports</text>

<rect x="685" y="170" width="270" height="250" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="710" y="210" font-family="Arial" font-size="22" font-weight="700" fill="#b45309">03 • Warehouse</text>
<text x="710" y="250" font-family="Arial" font-size="17" fill="#374151">Check Inventory</text>
<text x="710" y="282" font-family="Arial" font-size="17" fill="#374151">Release Equipment</text>
<text x="710" y="314" font-family="Arial" font-size="17" fill="#374151">Record Stock Out</text>
<text x="710" y="346" font-family="Arial" font-size="17" fill="#374151">Record Return</text>
<text x="710" y="378" font-family="Arial" font-size="17" fill="#374151">Calculate Fine</text>

<rect x="1000" y="170" width="270" height="250" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1025" y="210" font-family="Arial" font-size="22" font-weight="700" fill="#6d28d9">04 • Customer Return</text>
<text x="1025" y="250" font-family="Arial" font-size="17" fill="#374151">Submit Return Photo</text>
<text x="1025" y="282" font-family="Arial" font-size="17" fill="#374151">Pay Fine if Required</text>
<text x="1025" y="314" font-family="Arial" font-size="17" fill="#374151">Track Final Status</text>
<text x="1025" y="346" font-family="Arial" font-size="17" fill="#374151">Order Completion</text>

<rect x="1315" y="170" width="230" height="250" rx="16" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="1340" y="210" font-family="Arial" font-size="22" font-weight="700" fill="#374151">05 • Leader</text>
<text x="1340" y="250" font-family="Arial" font-size="17" fill="#374151">Monitor</text>
<text x="1340" y="282" font-family="Arial" font-size="17" fill="#374151">Review Reports</text>
<text x="1340" y="314" font-family="Arial" font-size="17" fill="#374151">PDF Export</text>
<text x="1340" y="346" font-family="Arial" font-size="17" fill="#374151">Transaction Overview</text>

<line x1="325" y1="295" x2="370" y2="295" stroke="#6b7280" stroke-width="3"/>
<polygon points="370,295 355,287 355,303" fill="#6b7280"/>
<line x1="640" y1="295" x2="685" y2="295" stroke="#6b7280" stroke-width="3"/>
<polygon points="685,295 670,287 670,303" fill="#6b7280"/>
<line x1="955" y1="295" x2="1000" y2="295" stroke="#6b7280" stroke-width="3"/>
<polygon points="1000,295 985,287 985,303" fill="#6b7280"/>
<line x1="1270" y1="295" x2="1315" y2="295" stroke="#6b7280" stroke-width="3"/>
<polygon points="1315,295 1300,287 1300,303" fill="#6b7280"/>

<line x1="55" y1="500" x2="1545" y2="500" stroke="#e5e7eb"/>
<text x="55" y="545" font-family="Arial" font-size="20" font-weight="700" fill="#111827">System controls</text>
<text x="55" y="585" font-family="Arial" font-size="16" fill="#374151">Authentication & role authorization</text>
<text x="360" y="585" font-family="Arial" font-size="16" fill="#374151">PDO Prepared Statements</text>
<text x="640" y="585" font-family="Arial" font-size="16" fill="#374151">Database Transactions</text>
<text x="900" y="585" font-family="Arial" font-size="16" fill="#374151">Payment Status Lifecycle</text>
<text x="1200" y="585" font-family="Arial" font-size="16" fill="#374151">Stock Movement History</text>
<text x="55" y="625" font-family="Arial" font-size="16" fill="#374151">Return & Fine Management</text>
<text x="360" y="625" font-family="Arial" font-size="16" fill="#374151">PDF Reporting</text>
<text x="640" y="625" font-family="Arial" font-size="16" fill="#374151">Responsive UI</text>
</svg>