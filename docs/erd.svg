<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1800" height="1150" fill="#f8fafc"/>
  <text x="70" y="75" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">Entity Relationship Diagram</text>
  <text x="70" y="112" fill="#64748b" font-family="Arial" font-size="20">Database schema — penyewaan_tari</text>

  <!-- users -->
  <g filter="url(#shadow)">
    <rect x="75" y="180" rx="14" width="360" height="360" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="75" y="180" rx="14" width="360" height="55" fill="#2563eb"/>
    <text x="100" y="216" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">users</text>
    <text x="100" y="265" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="100" y="293" fill="#334155" font-family="monospace" font-size="16">nama : varchar(100)</text>
    <text x="100" y="321" fill="#334155" font-family="monospace" font-size="16">username : varchar(50) UNIQUE</text>
    <text x="100" y="349" fill="#334155" font-family="monospace" font-size="16">password : varchar(255)</text>
    <text x="100" y="377" fill="#334155" font-family="monospace" font-size="16">role : enum(...)</text>
    <text x="100" y="405" fill="#334155" font-family="monospace" font-size="16">no_telp : varchar(20)</text>
    <text x="100" y="433" fill="#334155" font-family="monospace" font-size="16">alamat : text</text>
    <text x="100" y="461" fill="#334155" font-family="monospace" font-size="16">created_at : timestamp</text>
  </g>

  <!-- penyewaan -->
  <g filter="url(#shadow)">
    <rect x="575" y="150" rx="14" width="470" height="430" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <rect x="575" y="150" rx="14" width="470" height="55" fill="#0f766e"/>
    <text x="600" y="186" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">penyewaan</text>
    <text x="600" y="235" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="600" y="263" fill="#334155" font-family="monospace" font-size="16">FK  user_id : int</text>
    <text x="600" y="291" fill="#334155" font-family="monospace" font-size="16">tanggal_sewa : date</text>
    <text x="600" y="319" fill="#334155" font-family="monospace" font-size="16">tanggal_kembali : date</text>
    <text x="600" y="347" fill="#334155" font-family="monospace" font-size="16">total_biaya : decimal</text>
    <text x="600" y="375" fill="#334155" font-family="monospace" font-size="16">status : enum(...)</text>
    <text x="600" y="403" fill="#334155" font-family="monospace" font-size="16">bukti_pembayaran : varchar</text>
    <text x="600" y="431" fill="#334155" font-family="monospace" font-size="16">status_pembayaran : enum(...)</text>
    <text x="600" y="459" fill="#334155" font-family="monospace" font-size="16">catatan : text</text>
    <text x="600" y="487" fill="#334155" font-family="monospace" font-size="16">foto_konfirmasi_pelanggan</text>
    <text x="600" y="515" fill="#334155" font-family="monospace" font-size="16">created_at / updated_at</text>
  </g>

  <!-- detail -->
  <g filter="url(#shadow)">
    <rect x="1150" y="190" rx="14" width="390" height="250" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="1150" y="190" rx="14" width="390" height="55" fill="#7c3aed"/>
    <text x="1175" y="226" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">detail_penyewaan</text>
    <text x="1175" y="275" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="1175" y="305" fill="#334155" font-family="monospace" font-size="16">FK  penyewaan_id : int</text>
    <text x="1175" y="335" fill="#334155" font-family="monospace" font-size="16">FK  peralatan_id : int</text>
    <text x="1175" y="365" fill="#334155" font-family="monospace" font-size="16">jumlah_pinjam : int</text>
  </g>

  <!-- equipment -->
  <g filter="url(#shadow)">
    <rect x="1120" y="520" rx="14" width="430" height="330" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <rect x="1120" y="520" rx="14" width="430" height="55" fill="#d97706"/>
    <text x="1145" y="556" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">peralatan</text>
    <text x="1145" y="605" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="1145" y="635" fill="#334155" font-family="monospace" font-size="16">nama_alat : varchar(100)</text>
    <text x="1145" y="665" fill="#334155" font-family="monospace" font-size="16">kategori_alat : enum(...)</text>
    <text x="1145" y="695" fill="#334155" font-family="monospace" font-size="16">stok : int</text>
    <text x="1145" y="725" fill="#334155" font-family="monospace" font-size="16">harga_sewa : decimal</text>
    <text x="1145" y="755" fill="#334155" font-family="monospace" font-size="16">kondisi : varchar(50)</text>
    <text x="1145" y="785" fill="#334155" font-family="monospace" font-size="16">foto / deskripsi</text>
    <text x="1145" y="815" fill="#334155" font-family="monospace" font-size="16">created_at / updated_at</text>
  </g>

  <!-- return -->
  <g filter="url(#shadow)">
    <rect x="585" y="690" rx="14" width="420" height="300" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <rect x="585" y="690" rx="14" width="420" height="55" fill="#dc2626"/>
    <text x="610" y="726" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">pengembalian</text>
    <text x="610" y="775" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="610" y="803" fill="#334155" font-family="monospace" font-size="16">FK  penyewaan_id : int UNIQUE</text>
    <text x="610" y="831" fill="#334155" font-family="monospace" font-size="16">tanggal_dikembalikan : date</text>
    <text x="610" y="859" fill="#334155" font-family="monospace" font-size="16">denda_keterlambatan : decimal</text>
    <text x="610" y="887" fill="#334155" font-family="monospace" font-size="16">status_denda : enum(...)</text>
    <text x="610" y="915" fill="#334155" font-family="monospace" font-size="16">kondisi_peralatan : text</text>
    <text x="610" y="943" fill="#334155" font-family="monospace" font-size="16">FK  dicatat_oleh : int</text>
  </g>

  <!-- stock -->
  <g filter="url(#shadow)">
    <rect x="80" y="700" rx="14" width="385" height="275" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
    <rect x="80" y="700" rx="14" width="385" height="55" fill="#0891b2"/>
    <text x="105" y="736" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">riwayat_stok</text>
    <text x="105" y="785" fill="#0f172a" font-family="monospace" font-size="17">PK  id : int</text>
    <text x="105" y="813" fill="#334155" font-family="monospace" font-size="16">FK  peralatan_id : int</text>
    <text x="105" y="841" fill="#334155" font-family="monospace" font-size="16">FK  penyewaan_id : int</text>
    <text x="105" y="869" fill="#334155" font-family="monospace" font-size="16">jenis : enum(keluar, masuk)</text>
    <text x="105" y="897" fill="#334155" font-family="monospace" font-size="16">jumlah : int</text>
    <text x="105" y="925" fill="#334155" font-family="monospace" font-size="16">keterangan : text</text>
    <text x="105" y="953" fill="#334155" font-family="monospace" font-size="16">dicatat_pada : timestamp</text>
  </g>

  <!-- relations -->
  <g stroke="#64748b" stroke-width="3" fill="none">
    <line x1="435" y1="340" x2="575" y2="340"/>
    <line x1="1045" y1="300" x2="1150" y2="300"/>
    <line x1="1250" y1="440" x2="1250" y2="520"/>
    <line x1="820" y1="580" x2="790" y2="690"/>
    <line x1="1045" y1="430" x2="760" y2="690"/>
    <line x1="435" y1="470" x2="585" y2="815"/>
    <line x1="275" y1="700" x2="1120" y2="730"/>
    <line x1="800" y1="580" x2="470" y2="815"/>
  </g>

  <g fill="#475569" font-family="Arial" font-size="16" font-weight="700">
    <text x="470" y="325">1 : N</text>
    <text x="1060" y="285">1 : N</text>
    <text x="1260" y="500">1 : N</text>
    <text x="810" y="640">1 : 1</text>
    <text x="905" y="570">1 : N</text>
    <text x="490" y="630">1 : N</text>
    <text x="690" y="715">1 : N</text>
    <text x="600" y="645">1 : N</text>
  </g>

  <text x="80" y="1070" fill="#64748b" font-family="Arial" font-size="16">PK = Primary Key • FK = Foreign Key • Relationship labels reflect the current SQL constraints</text>
</svg>